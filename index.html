<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OldBook4U — Buy & sell used books near you</title>
<meta name="description" content="Find secondhand school, college and entrance exam books near you, or sell the ones you've outgrown.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    background:#1C2A38;
    color:#F3EEDF;
    font-family:'Public Sans', sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .glow{
    position:absolute; width:600px; height:600px; border-radius:50%;
    background:radial-gradient(circle, rgba(184,132,43,0.25), transparent 65%);
    top:-200px; right:-200px; pointer-events:none;
  }
  .splash{
    text-align:center; position:relative; z-index:2;
    animation:riseIn .7s ease both;
  }
  @keyframes riseIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .logo{
    display:flex; align-items:center; justify-content:center; gap:12px;
    font-family:'Fraunces', serif; font-weight:700; font-size:32px; color:#fff;
  }
  .mark{
    width:36px; height:36px; background:#B8842B; border-radius:6px; position:relative; flex:none;
  }
  .mark::after,.mark::before{ content:""; position:absolute; top:6px; bottom:6px; width:3px; background:#1C2A38; }
  .mark::after{ left:9px; }
  .mark::before{ left:17px; }

  .tagline{ margin-top:12px; font-size:14.5px; color:#B7C0C8; letter-spacing:.02em; }

  .loader{
    margin:38px auto 0;
    width:150px; height:3px; background:rgba(255,255,255,0.12); border-radius:99px; overflow:hidden;
  }
  .loader-bar{
    height:100%; width:0%; background:#B8842B; border-radius:99px;
    animation:load 1.1s ease forwards;
  }
  @keyframes load{ to{ width:100%; } }

  .enter-btn{
    display:none;
    margin-top:30px;
    background:#B8842B; color:#fff; border:none;
    padding:13px 30px; border-radius:8px;
    font-family:'Public Sans', sans-serif; font-weight:700; font-size:14.5px;
    cursor:pointer;
  }
  .enter-btn:hover{ background:#8F6420; }

  .skip-note{ margin-top:16px; font-size:12px; color:#7C8792; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="splash">
    <div class="logo"><span class="mark"></span> OldBook4U</div>
    <p class="tagline">Books someone's done with. Books someone else needs.</p>
    <div class="loader"><div class="loader-bar" id="loaderBar"></div></div>
    <button class="enter-btn" id="enterBtn" onclick="goToApp()">Enter OldBook4U</button>
    <p class="skip-note" id="skipNote">Loading your local book marketplace…</p>
  </div>

<script>
  function goToApp(){
    window.location.href = 'app.html';
  }
  // Auto-advance shortly after the loader finishes; also offer a manual
  // button in case the browser blocks auto-redirects.
  setTimeout(() => {
    document.getElementById('enterBtn').style.display = 'inline-block';
    document.getElementById('skipNote').textContent = "Taking you in…";
  }, 900);
  setTimeout(goToApp, 1500);
</script>
</body>
</html>
